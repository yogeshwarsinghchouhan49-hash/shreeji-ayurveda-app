
name: Build Shreeji Ayurveda APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android Project
        run: |
          ZIP=$(find . -maxdepth 1 -name 'ShreejiAyurveda-Native-Android-Source*.zip' -print -quit)
          test -n "$ZIP"
          mkdir extracted
          unzip -q "$ZIP" -d extracted

      - name: Build APK
        run: gradle -p extracted/ShreejiAyurveda assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Shreeji-Ayurveda-APK
          path: extracted/ShreejiAyurveda/app/build/outputs/apk/debug/app-debug.apk
